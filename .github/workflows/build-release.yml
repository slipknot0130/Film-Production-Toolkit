name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
          # Windows ARM64（public preview，仅公开仓库可用）
          - os: windows-11-arm
            arch: arm64
          # macOS Intel
          - os: macos-15-intel
            arch: x64
          # macOS Apple Silicon (M芯片)
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements-core.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ "$VERSION" = "" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python build.py --zip --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmProductionToolkit-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -R dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
